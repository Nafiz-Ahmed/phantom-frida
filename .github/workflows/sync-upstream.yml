name: Sync Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/TheQmaks/phantom-frida.git
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main --no-edit
          git push origin main
