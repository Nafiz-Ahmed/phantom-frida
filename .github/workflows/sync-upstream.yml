name: Sync Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync with upstream
        env:
          TARGET_BRANCH: master
        run: |
          git remote add upstream https://github.com/TheQmaks/phantom-frida.git
          git fetch upstream
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git merge "upstream/$TARGET_BRANCH" --ff-only || git merge "upstream/$TARGET_BRANCH" --no-edit
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET_BRANCH"
